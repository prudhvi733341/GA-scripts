name: validating workflow without checkout

on:
  workflow_dispatch:

jobs:
  files:
    runs-on: ubuntu-latest
    steps:
      - name: checkout the repo
        uses: actions/checkout@v7

      - name: display the content of a file
        run: cat devops.txt

      - name: display the date
        run: date
      - name: changing the permissions
        run: chmod +x uptime.sh

      - name: execute the shell script
        run: ./uptime.sh
