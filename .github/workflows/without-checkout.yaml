name: validating workflow without checkout

on:
  workflow_dispatch:

jobs:
  files:
    runs-on: ubuntu-latest
    steps:
      - name: checkout the repo
        uses: actions/checkout@v7

      - name: display the content of a file
        run: |
            cat devops.txt
            pwd
            ls -lrth
            date
            chmod +x uptime.sh
            ./uptime.sh
